name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: kirinuki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Kirinuki#2026"
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Kirinuki#2026' -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: kirinuki
          APP_USER: kirinuki
          APP_USER_PASSWORD: kirinuki
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 60
    env:
      KIRINUKI_TEST_POSTGRES_URL: postgres://postgres:kirinuki@127.0.0.1:5432/postgres
      KIRINUKI_TEST_MSSQL_URL: mssql://sa:Kirinuki%232026@127.0.0.1:1433/master
      KIRINUKI_TEST_ORACLE_URL: oracle://kirinuki:kirinuki@127.0.0.1:1521/FREEPDB1
      # creates the SELECT-only user the Oracle test connects as
      KIRINUKI_TEST_ORACLE_ADMIN_URL: oracle://system:kirinuki@127.0.0.1:1521/FREEPDB1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
